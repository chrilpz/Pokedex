<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pokédex — Gen I–V</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d1a;
    --surface: #16162a;
    --card: #1e1e38;
    --card-hover: #252545;
    --border: #2e2e55;
    --accent: #e63946;
    --accent2: #f4a261;
    --text: #e8e8f5;
    --text-dim: #7a7a9d;
    --caught-glow: #4ecca3;
    --pixel: "Press Start 2P";
    --body: "Nunito";

    /* Type colors */
    --normal: #9a9a7a; --fire: #f08030; --water: #6890f0; --electric: #f8d030;
    --grass: #78c850; --ice: #98d8d8; --fighting: #c03028; --poison: #a040a0;
    --ground: #e0c068; --flying: #a890f0; --psychic: #f85888; --bug: #a8b820;
    --rock: #b8a038; --ghost: #705898; --dragon: #7038f8; --dark: #705848;
    --steel: #b8b8d0; --fairy: #f0b6bc;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body), sans-serif;
    min-height: 100vh;
    overscroll-behavior: none;
  }

  /* ── HEADER ── */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: linear-gradient(180deg, #0d0d1a 60%, transparent);
    padding: 14px 16px 10px;
    backdrop-filter: blur(12px);
  }

  .header-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }

  .logo {
    font-family: var(--pixel), monospace;
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 1px;
    text-shadow: 0 0 20px rgba(230,57,70,0.6);
    line-height: 1.4;
  }

  .logo span { color: var(--text-dim); font-size: 7px; display: block; margin-top: 2px; }

  .stats-pill {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-dim);
    display: flex; align-items: center; gap: 6px;
  }

  .stats-pill .caught-count {
    color: var(--caught-glow);
    font-family: var(--pixel), monospace;
    font-size: 9px;
  }

  /* ── SEARCH & FILTERS ── */
  .search-bar {
    position: relative; margin-bottom: 10px;
  }

  .search-bar input {
    width: 100%;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 11px 16px 11px 40px;
    color: var(--text);
    font-family: var(--body), sans-serif;
    font-size: 14px;
    font-weight: 600;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-bar input:focus { border-color: var(--accent); }
  .search-bar input::placeholder { color: var(--text-dim); }

  .search-icon {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    color: var(--text-dim); font-size: 16px; pointer-events: none;
  }

  .filter-row {
    display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px;
    scrollbar-width: none;
  }
  .filter-row::-webkit-scrollbar { display: none; }

  .filter-btn {
    flex-shrink: 0;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 6px 12px;
    color: var(--text-dim);
    font-family: var(--body), sans-serif;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .filter-btn.active, .filter-btn:active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .filter-btn.gen-active {
    border-color: var(--accent2);
    color: var(--accent2);
  }

  /* ── VIEW TOGGLE ── */
  .view-toggle {
    display: flex; gap: 4px; margin-left: auto;
  }

  .view-btn {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 6px 9px;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s;
  }
  .view-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

  /* ── PROGRESS BAR ── */
  .progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 10px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--caught-glow), var(--accent2));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  /* ── GRID ── */
  .pokemon-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 8px 12px 100px;
  }

  .pokemon-grid.list-view {
    grid-template-columns: 1fr;
    gap: 6px;
  }

  /* ── CARD ── */
  .poke-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 10px 6px 8px;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
    position: relative;
    overflow: hidden;
    text-align: center;
    user-select: none;
  }

  .poke-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }

  .poke-card.caught {
    border-color: var(--caught-glow);
    background: #1a2e2a;
  }

  .poke-card.caught::before {
    background: radial-gradient(circle at top right, rgba(78,204,163,0.08), transparent 60%);
    opacity: 1;
  }

  .poke-card:active { transform: scale(0.95); }

  .card-num {
    font-family: var(--pixel), monospace;
    font-size: 7px;
    color: var(--text-dim);
    margin-bottom: 4px;
    display: block;
  }

  .poke-img-wrap {
    width: 64px; height: 64px;
    margin: 0 auto 4px;
    position: relative;
  }

  .poke-img {
    width: 64px; height: 64px;
    image-rendering: pixelated;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
    transition: filter 0.2s;
  }

  .poke-card:not(.caught) .poke-img {
    filter: brightness(0) drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    opacity: 0.3;
  }

  /* CHECK BUTTON — tappable from card */
  .check-btn {
    position: absolute; top: 5px; right: 5px;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 900;
    z-index: 5;
    transition: all .15s;
    color: var(--text-dim);
    cursor: pointer;
    line-height: 1;
    padding: 0;
  }
  .poke-card.caught .check-btn {
    background: var(--caught-glow);
    border-color: var(--caught-glow);
    color: #0d0d1a;
  }

  .pokemon-grid.list-view .check-btn {
    position: static;
    margin-left: auto;
    width: 28px; height: 28px;
    font-size: 13px;
    flex-shrink: 0;
  }

  .poke-name {
    font-size: 9px;
    font-weight: 900;
    color: var(--text);
    text-transform: capitalize;
    line-height: 1.2;
    margin-bottom: 5px;
  }

  .poke-card:not(.caught) .poke-name { color: var(--text-dim); }

  .type-tags {
    display: flex; gap: 3px; justify-content: center; flex-wrap: wrap;
  }

  .type-tag {
    font-size: 7px;
    font-weight: 700;
    padding: 2px 5px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: white;
    opacity: 0.85;
  }

  /* ── LIST VIEW CARD ── */
  .pokemon-grid.list-view .poke-card {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px;
    text-align: left;
    border-radius: 12px;
  }

  .pokemon-grid.list-view .poke-img-wrap {
    width: 48px; height: 48px; margin: 0; flex-shrink: 0;
  }

  .pokemon-grid.list-view .poke-img { width: 48px; height: 48px; }

  .pokemon-grid.list-view .card-info { flex: 1; }

  .pokemon-grid.list-view .card-num { margin-bottom: 1px; }
  .pokemon-grid.list-view .poke-name { font-size: 13px; margin-bottom: 4px; }




  /* ── GEN DIVIDER ── */
  .gen-divider {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0 2px;
  }

  .gen-label {
    font-family: var(--pixel), monospace;
    font-size: 8px;
    color: var(--accent2);
    white-space: nowrap;
  }

  .gen-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .gen-count {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-dim);
    white-space: nowrap;
  }

  /* ── DETAIL MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    display: flex; align-items: flex-end;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
  }

  .modal-overlay.open {
    opacity: 1; pointer-events: all;
  }

  .modal {
    width: 100%;
    max-height: 88vh;
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    border-top: 2px solid var(--border);
    overflow-y: auto;
    transform: translateY(30px);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    padding-bottom: 40px;
  }

  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 12px auto 0;
  }

  .modal-header {
    padding: 16px 20px 0;
    display: flex; align-items: flex-start; justify-content: space-between;
  }

  .modal-num {
    font-family: var(--pixel), monospace;
    font-size: 9px;
    color: var(--text-dim);
    margin-bottom: 4px;
    display: block;
  }

  .modal-name {
    font-size: 28px;
    font-weight: 900;
    text-transform: capitalize;
    line-height: 1;
  }

  .modal-types { display: flex; gap: 6px; margin-top: 8px; }

  .modal-type-tag {
    font-size: 11px; font-weight: 700;
    padding: 4px 12px; border-radius: 20px;
    text-transform: uppercase; color: white;
  }

  .modal-img-wrap {
    text-align: center; padding: 10px 0;
    position: relative;
  }

  .modal-img {
    width: 140px; height: 140px;
    image-rendering: pixelated;
    filter: drop-shadow(0 4px 20px rgba(0,0,0,0.5));
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .modal-img-wrap .silhouette .modal-img {
    filter: brightness(0) opacity(0.2);
    animation: none;
  }

  .catch-btn {
    width: calc(100% - 32px);
    margin: 0 16px 16px;
    padding: 16px;
    border-radius: 14px;
    border: none;
    font-family: var(--body), sans-serif;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }

  .catch-btn.not-caught {
    background: var(--accent);
    color: white;
  }

  .catch-btn.caught {
    background: transparent;
    border: 2px solid var(--caught-glow);
    color: var(--caught-glow);
  }

  .modal-stats {
    padding: 0 16px 8px;
  }

  .stat-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
  }

  .stat-name {
    font-size: 10px; font-weight: 700;
    color: var(--text-dim);
    width: 56px; text-align: right;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  .stat-val {
    font-family: var(--pixel), monospace;
    font-size: 9px;
    color: var(--text);
    width: 28px;
    text-align: left;
    flex-shrink: 0;
  }

  .stat-bar-wrap {
    flex: 1; height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  .stat-bar {
    height: 100%;
    border-radius: 4px;
    transition: width 0.5s ease;
  }

  .modal-section-title {
    font-family: var(--pixel), monospace;
    font-size: 8px;
    color: var(--text-dim);
    padding: 12px 16px 8px;
    letter-spacing: 1px;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }

  .empty-state .pixel-text {
    font-family: var(--pixel), monospace;
    font-size: 10px;
    margin-bottom: 12px;
    line-height: 2;
  }

  /* ── BOTTOM SAFE ── */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: linear-gradient(0deg, var(--bg) 70%, transparent);
    padding: 16px 16px 24px;
    display: flex; justify-content: center;
    pointer-events: none;
  }

  .reset-btn {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 8px 20px;
    color: var(--text-dim);
    font-family: var(--body), sans-serif;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    pointer-events: all;
    transition: all 0.15s;
  }

  .reset-btn:active { transform: scale(0.95); }

  /* Type bg for modal */
  .modal-type-bg {
    position: absolute; top: 0; left: 0; right: 0;
    height: 180px;
    opacity: 0.06;
    pointer-events: none;
    border-radius: 24px 24px 0 0;
  }

  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--caught-glow);
    color: #0d0d1a;
    font-weight: 900;
    font-size: 13px;
    padding: 10px 20px;
    border-radius: 20px;
    z-index: 300;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">
      POKÉDEX
      <span>GENERACIONES I – V</span>
    </div>
    <div style="display:flex; gap:6px; align-items:center;">
      <div class="stats-pill">
        <span>✓</span>
        <span class="caught-count" id="caught-display">0</span>
        <span>/ 649</span>
      </div>
      <div class="view-toggle">
        <button class="view-btn active" id="grid-btn" onclick="setView('grid')">⊞</button>
        <button class="view-btn" id="list-btn" onclick="setView('list')">☰</button>
      </div>
    </div>
  </div>

  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input type="text" id="search-input" placeholder="Buscar por nombre o número…" oninput="renderList()">
  </div>

  <div class="filter-row" id="filter-row">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">Todos</button>
    <button class="filter-btn" data-filter="caught" onclick="setFilter('caught', this)">Capturados</button>
    <button class="filter-btn" data-filter="missing" onclick="setFilter('missing', this)">Pendientes</button>
    <button class="filter-btn" data-filter="gen1" onclick="setFilter('gen1', this)">Gen I</button>
    <button class="filter-btn" data-filter="gen2" onclick="setFilter('gen2', this)">Gen II</button>
    <button class="filter-btn" data-filter="gen3" onclick="setFilter('gen3', this)">Gen III</button>
    <button class="filter-btn" data-filter="gen4" onclick="setFilter('gen4', this)">Gen IV</button>
    <button class="filter-btn" data-filter="gen5" onclick="setFilter('gen5', this)">Gen V</button>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill" style="width:0%"></div>
  </div>
</div>

<div class="pokemon-grid" id="pokemon-grid"></div>

<div class="bottom-nav">
  <button class="reset-btn" onclick="confirmReset()">↺ Reiniciar progreso</button>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div id="modal-bg" class="modal-type-bg"></div>
    <div class="modal-header">
      <div>
        <span class="modal-num" id="m-num"></span>
        <div class="modal-name" id="m-name"></div>
        <div class="modal-types" id="m-types"></div>
      </div>
    </div>
    <div class="modal-img-wrap" id="m-img-wrap">
      <img class="modal-img" id="m-img" src="" alt="">
    </div>
    <button class="catch-btn" id="catch-btn" onclick="toggleFromModal()"></button>
    <div class="modal-section-title">ESTADÍSTICAS BASE</div>
    <div class="modal-stats" id="m-stats"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

// Build pokemon array
const POKEMON = RAW.map((r, i) => ({
  id: i + 1,
  name: r[0],
  type1: r[1],
  type2: r[2],
  stats: { hp: r[3], atk: r[4], def: r[5], spatk: r[6], spdef: r[7], spe: r[8] }
}));

function getGen(id) {
  if (id <= 151) return 1;
  if (id <= 251) return 2;
  if (id <= 386) return 3;
  if (id <= 493) return 4;
  return 5;
}

function spriteUrl(id) {
  return `https://img.pokemondb.net/sprites/black-white/normal/${POKEMON[id-1].name}.png`;
}
function spriteUrlFallback(id) {
  return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
}
function handleImgError(img, id, attempt) {
  attempt = attempt || 1;
  if (attempt === 1) img.src = spriteUrlFallback(id);
  img.setAttribute('data-attempt', attempt + 1);
  if (attempt < 2) img.onerror = function(){ handleImgError(this, id, attempt + 1); };
  else img.onerror = null;
}

function pad(n) { return String(n).padStart(3, '0'); }

// ── STATE ──
let caught = new Set(JSON.parse(localStorage.getItem('pokedex_caught') || '[]'));
let currentFilter = 'all';
let currentView = 'grid';
let modalPokemon = null;

function toggleCatch(id, e) {
  e.stopPropagation();
  const wasCaught = caught.has(id);
  if (wasCaught) { caught.delete(id); showToast(POKEMON[id-1].name + ' eliminado'); }
  else { caught.add(id); showToast('¡' + POKEMON[id-1].name + ' capturado!'); }
  save();
  // Update card in place
  const card = document.querySelector('[data-id="' + id + '"]');
  if (card) {
    card.classList.toggle('caught', !wasCaught);
    const btn = card.querySelector('.check-btn');
    if (btn) btn.textContent = wasCaught ? '○' : '✓';
  }
  if (modalPokemon && modalPokemon.id === id) updateCatchBtn(!wasCaught);
}

function save() {
  localStorage.setItem('pokedex_caught', JSON.stringify([...caught]));
  updateStats();
}

function updateStats() {
  const c = caught.size;
  document.getElementById('caught-display').textContent = c;
  document.getElementById('progress-fill').style.width = (c / 649 * 100) + '%';
}

function setView(v) {
  currentView = v;
  const grid = document.getElementById('pokemon-grid');
  grid.className = 'pokemon-grid' + (v === 'list' ? ' list-view' : '');
  document.getElementById('grid-btn').className = 'view-btn' + (v === 'grid' ? ' active' : '');
  document.getElementById('list-btn').className = 'view-btn' + (v === 'list' ? ' active' : '');
  renderList();
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active', 'gen-active'));
  if (f.startsWith('gen')) el.classList.add('gen-active');
  else el.classList.add('active');
  renderList();
}

// Fuzzy: letters must appear in order within the name
function fuzzyMatch(name, query) {
  if (!query) return true;
  query = query.toLowerCase();
  name = name.toLowerCase().replace(/-/g, '');
  if (name.includes(query)) return true;
  if (query.length >= 2) {
    let qi = 0;
    for (let i = 0; i < name.length && qi < query.length; i++) {
      if (name[i] === query[qi]) qi++;
    }
    if (qi === query.length) return true;
  }
  return false;
}

function getFiltered() {
  const q = document.getElementById('search-input').value.trim();
  return POKEMON.filter(p => {
    if (currentFilter === 'caught' && !caught.has(p.id)) return false;
    if (currentFilter === 'missing' && caught.has(p.id)) return false;
    if (currentFilter === 'gen1' && getGen(p.id) !== 1) return false;
    if (currentFilter === 'gen2' && getGen(p.id) !== 2) return false;
    if (currentFilter === 'gen3' && getGen(p.id) !== 3) return false;
    if (currentFilter === 'gen4' && getGen(p.id) !== 4) return false;
    if (currentFilter === 'gen5' && getGen(p.id) !== 5) return false;
    if (q) {
      const matchName = fuzzyMatch(p.name, q);
      const matchNum = pad(p.id).includes(q) || String(p.id).includes(q);
      if (!matchName && !matchNum) return false;
    }
    return true;
  });
}

function renderList() {
  const filtered = getFiltered();
  const grid = document.getElementById('pokemon-grid');
  const showGenDividers = (currentFilter === 'all' || currentFilter.startsWith('gen')) &&
    !document.getElementById('search-input').value.trim();

  let html = '';
  let lastGen = null;

  if (filtered.length === 0) {
    html = `<div class="empty-state">
      <div class="pixel-text">? ? ?</div>
      <div style="font-weight:700; color:var(--text-dim)">No encontrado en la Pokédex</div>
    </div>`;
  } else {
    filtered.forEach(p => {
      const gen = getGen(p.id);
      if (showGenDividers && gen !== lastGen) {
        const genData = GENS[gen - 1];
        const genCaught = [...caught].filter(id => getGen(id) === gen).length;
        const genTotal = genData.end - genData.start + 1;
        html += `<div class="gen-divider">
          <span class="gen-label">${genData.name}</span>
          <div class="gen-line"></div>
          <span class="gen-count">${genCaught}/${genTotal}</span>
        </div>`;
        lastGen = gen;
      }

      const isCaught = caught.has(p.id);
      const typeColor = TYPE_COLORS[p.type1] || '#888';

      if (currentView === 'list') {
        html += `<div class="poke-card${isCaught ? ' caught' : ''}" data-id="${p.id}" onclick="openModal(${p.id})">
          <div class="poke-img-wrap">
            <img class="poke-img" src="${spriteUrl(p.id)}" alt="${p.name}" loading="lazy" onerror="handleImgError(this,${p.id},1)">
          </div>
          <div class="card-info">
            <span class="card-num">#${pad(p.id)}</span>
            <div class="poke-name">${p.name}</div>
            <div class="type-tags">
              <span class="type-tag" style="background:${typeColor}">${p.type1}</span>
              ${p.type2 ? `<span class="type-tag" style="background:${TYPE_COLORS[p.type2] || '#888'}">${p.type2}</span>` : ''}
            </div>
          </div>
          <button class="check-btn" onclick="toggleCatch(${p.id},event)">${isCaught ? '✓' : '○'}</button>
        </div>`;
      } else {
        html += `<div class="poke-card${isCaught ? ' caught' : ''}" data-id="${p.id}" onclick="openModal(${p.id})">
          <button class="check-btn" onclick="toggleCatch(${p.id},event)">${isCaught ? '✓' : '○'}</button>
          <span class="card-num">#${pad(p.id)}</span>
          <div class="poke-img-wrap">
            <img class="poke-img" src="${spriteUrl(p.id)}" alt="${p.name}" loading="lazy" onerror="handleImgError(this,${p.id},1)">
          </div>
          <div class="poke-name">${p.name}</div>
          <div class="type-tags">
            <span class="type-tag" style="background:${typeColor}">${p.type1}</span>
            ${p.type2 ? `<span class="type-tag" style="background:${TYPE_COLORS[p.type2] || '#888'}">${p.type2}</span>` : ''}
          </div>
        </div>`;
      }
    });
  }

  grid.innerHTML = html;
}

// ── MODAL ──
function openModal(id) {
  const p = POKEMON[id - 1];
  modalPokemon = p;
  const isCaught = caught.has(p.id);
  const typeColor = TYPE_COLORS[p.type1];

  document.getElementById('m-num').textContent = `#${pad(p.id)}`;
  document.getElementById('m-name').textContent = p.name;

  let typesHtml = `<span class="modal-type-tag" style="background:${typeColor}">${p.type1}</span>`;
  if (p.type2) typesHtml += `<span class="modal-type-tag" style="background:${TYPE_COLORS[p.type2] || '#888'}">${p.type2}</span>`;
  document.getElementById('m-types').innerHTML = typesHtml;

  document.getElementById('m-img').src = spriteUrl(p.id);
  document.getElementById('m-img').onerror = function(){ handleImgError(this, p.id, 1); };

  document.getElementById('modal-bg').style.background = `radial-gradient(circle, ${typeColor}, transparent 70%)`;

  updateCatchBtn(isCaught);

  // Stats
  const statVals = [p.stats.hp, p.stats.atk, p.stats.def, p.stats.spatk, p.stats.spdef, p.stats.spe];
  const maxStat = 255;
  let statsHtml = '';
  statVals.forEach((v, i) => {
    const pct = Math.round(v / maxStat * 100);
    statsHtml += `<div class="stat-row">
      <span class="stat-name">${STAT_NAMES[i]}</span>
      <span class="stat-val">${v}</span>
      <div class="stat-bar-wrap">
        <div class="stat-bar" style="width:${pct}%; background:${STAT_COLORS[i]}"></div>
      </div>
    </div>`;
  });
  document.getElementById('m-stats').innerHTML = statsHtml;

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function updateCatchBtn(isCaught) {
  const btn = document.getElementById('catch-btn');
  if (isCaught) {
    btn.textContent = '✓ Capturado — Quitar';
    btn.className = 'catch-btn caught';
  } else {
    btn.textContent = '◎ Marcar como capturado';
    btn.className = 'catch-btn not-caught';
  }
}

function toggleFromModal() {
  if (!modalPokemon) return;
  const id = modalPokemon.id;
  const wasCaught = caught.has(id);
  if (wasCaught) { caught.delete(id); showToast(modalPokemon.name + ' eliminado'); }
  else { caught.add(id); showToast('¡' + modalPokemon.name + ' capturado!'); }
  save();
  updateCatchBtn(!wasCaught);
  const card = document.querySelector('[data-id="' + id + '"]');
  if (card) {
    card.classList.toggle('caught', !wasCaught);
    const btn = card.querySelector('.check-btn');
    if (btn) btn.textContent = wasCaught ? '○' : '✓';
  }
}

function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('open');
    document.body.style.overflow = '';
    modalPokemon = null;
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function confirmReset() {
  if (confirm('¿Reiniciar todo el progreso? No se puede deshacer.')) {
    caught.clear();
    save();
    renderList();
    showToast('Progreso reiniciado');
  }
}

// ── INIT ──
updateStats();
renderList();
</script>
